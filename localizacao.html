<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Localização</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="localizacao.css">
</head>

<body>

<section class="localizacao">

  <!-- Brooklyn -->
  <div class="info">
    <h1>BROOKLYN</h1>

    <p class="endereco">
      Rua Demo, 123<br>
      Brasília, DF<br>
      70000
    </p>

    <h2>CONTATO</h2>
    <p class="contato">
      e-mail@exemplo.com<br>
      (055) 99855-5555
    </p>
  </div>

  <div class="mapa">
    <iframe
      src="https://www.google.com/maps?q=Brooklyn,+NY&z=13&output=embed"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>
  <div class="linha"></div>

  <!-- los angeles -->
  <div class="info">
    <h1>LOS ANGELES</h1>

    <p class="endereco">
      Rua Demo, 123<br>
      Goiânia, GO<br>
      74000
    </p>

    <h2>CONTATO</h2>
    <p class="contato">
      e-mail@exemplo.com<br>
      (055) 99855-5555
    </p>
  </div>

  <div class="mapa">
    <iframe
      src="https://www.google.com/maps?q=Los+Angeles,+CA&z=12&output=embed"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

</section>

</body>
</html>
